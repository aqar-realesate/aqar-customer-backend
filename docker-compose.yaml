services:
  mysql:
    image: mysql:8.4
    container_name: aqar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - aqar_mysql_data:/var/lib/mysql
volumes:
  aqar_mysql_data: